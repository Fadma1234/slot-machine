<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Slot Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <img class="logo" src="logo.png" alt="Fruit Machine Logo">
    <h1 class="slots">Welcome to Fadma's Fruit Slots!</h1>
    <div class="slots">
        <div><h1 class="sen">Feeling lucky today?</h1></div>
        <div class="reels">
            <div class="reel1"><img src="cherry.png" alt="Cherry"></div>
            <div class="reel2"><img src="lemon.png" alt="Lemon"></div>
            <div class="reel3"><img src="water.png" alt="Watermelon"></div>
        </div>
        <div id = "spin-button"class="buttons">
            <button class="small">Bet 5 coins</button>
            <button class="big">Bet 50 coins</button>
        </div>
        <h2>Coins Remaining: <span class="coins">10000</span></h2>
    </div>
    <script src="main.js"></script>
</body>
</html>
